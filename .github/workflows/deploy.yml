# Deployment: deploy/install.sh on a Linux machine with systemd, then a reboot, to check
# that the services (antigrafa-scheduler, antigrafa-web) come back on their own.
#
# The GitHub runner cannot reboot itself (the job would die with it): the reboot is that
# of a machine inside the runner, two ways:
#   1. container: a Debian container with systemd (podman, no --privileged), restarted.
#      Fast; systemd boots again, but not the kernel.
#   2. vm: a Debian cloud image under QEMU/KVM, really rebooted.
# The same checks run in both: tools/ci/first-start.sh, tools/ci/check-services.sh.
name: Deployment

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Install and restart (container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the machine (Debian + systemd)
        run: sudo podman build -t antigrafa-machine -f tools/ci/Containerfile tools/ci

      - name: Boot it
        # --systemd=always: podman mounts the cgroups and tmpfs systemd needs, without
        # --privileged (the host's devices stay out of reach)
        run: |
          sudo podman run -d --name machine --systemd=always -v "$PWD:/src:ro" antigrafa-machine
          tools/ci/wait-systemd.sh sudo podman exec machine

      - name: Install, first start
        run: sudo podman exec machine sh /src/tools/ci/first-start.sh

      - name: Check the services
        run: sudo podman exec machine sh /src/tools/ci/check-services.sh

      - name: Restart the machine
        run: |
          sudo podman restart -t 120 machine
          tools/ci/wait-systemd.sh sudo podman exec machine

      - name: Check the services after the restart
        run: sudo podman exec machine sh /src/tools/ci/check-services.sh --rebooted

      - name: Journal (on failure)
        if: failure()
        run: sudo podman exec machine journalctl --no-pager -n 300 || true

  vm:
    name: Install and reboot (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
      SSH: ssh -F ${{ github.workspace }}/vm/ssh_config vm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM, install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Prepare the VM (Debian 13 cloud image, cloud-init)
        run: |
          mkdir vm && cd vm
          curl -fsSL -o base.qcow2 "$IMAGE"
          qemu-img create -q -f qcow2 -b base.qcow2 -F qcow2 disk.qcow2 10G
          ssh-keygen -q -t ed25519 -N '' -f id_vm
          cat > user-data <<EOF
          #cloud-config
          users:
            - name: ci
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys: ["$(cat id_vm.pub)"]
          package_update: true
          packages: [python3-venv]
          EOF
          cloud-localds seed.iso user-data
          cat > ssh_config <<EOF
          Host vm
            HostName 127.0.0.1
            Port 2222
            User ci
            IdentityFile $PWD/id_vm
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ConnectTimeout 5
          EOF

      - name: Boot it
        run: |
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 2048 \
            -drive file=vm/disk.qcow2,if=virtio -drive file=vm/seed.iso,if=virtio,format=raw \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=net0 \
            -display none -serial file:vm/console.log -daemonize
          tools/ci/wait-ssh.sh 300 $SSH true
          # cloud-init installs python3-venv: wait for it (exit code 2: done, with warnings)
          $SSH cloud-init status --wait || [ $? -eq 2 ]

      - name: Copy the repository
        run: git archive HEAD | $SSH 'mkdir src && tar -x -C src'

      - name: Install, first start
        run: $SSH sudo sh src/tools/ci/first-start.sh

      - name: Check the services
        run: $SSH sudo sh src/tools/ci/check-services.sh

      - name: Reboot the VM
        run: |
          $SSH sudo systemctl reboot || true
          # Back up when the mark left in /run is gone: a new boot, not the old one
          tools/ci/wait-ssh.sh 300 $SSH test ! -e /run/antigrafa-ci-mark

      - name: Check the services after the reboot
        run: $SSH sudo sh src/tools/ci/check-services.sh --rebooted

      - name: Console and journal (on failure)
        if: failure()
        run: |
          tail -n 100 vm/console.log || true
          $SSH sudo journalctl --no-pager -n 300 || true
