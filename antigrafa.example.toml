# Antigrafa configuration. Copy it to /etc/antigrafa/antigrafa.toml, then edit it.
# Windows: %PROGRAMDATA%\antigrafa\antigrafa.toml. Another file: antigrafa -c <file>.

# =========================================================================== sources
# What to back up: one [source.<name>] per cluster. The name appears on the command
# line (--source cluster1) and as a folder in each target.

[source.cluster1]
type = "proxmox"                               # the platform
url = "https://pve1.example.lan:8006"          # address of the Proxmox API (any node)
token_id = "antigrafa@pve!backup"              # API token: user@realm!name
token_secret_file = "/etc/antigrafa/token"     # file holding the token secret (or token_secret = "...")

# Proxmox certificate. Copy /etc/pve/pve-root-ca.pem from a node.
ca_file = "/etc/antigrafa/pve-root-ca.pem"
# Test labs only: do not check the certificate (remove ca_file). Unsafe: the token can be stolen.
# verify_tls = false

# true: the node compares each piece of disk with the last backup and sends only what
# changed. Uses a bit of CPU on the node. false: send everything.
# remote_hash = true

# How the disks are frozen for the copy. No mode stops a guest.
#   "proxmox": Proxmox takes a snapshot of the whole guest. Fails if a disk cannot have
#              snapshots (LVM, iSCSI, raw file), even one excluded with backup=0.
#   "storage": Antigrafa takes a snapshot of each backed-up disk, on its storage.
#   "qemu":    QEMU keeps a frozen view of each disk while it is read. Works on every
#              storage, for VMs. Containers are handled as "storage".
#   "auto":    picks the best mode for each guest and writes its choice in the log.
snapshot_mode = "auto"           # default: "proxmox"

# ZFS disks of VMs: keep the last snapshot on the node, so the next backup reads only
# the changed parts. While it exists, Proxmox refuses to roll back to an older snapshot:
# delete the @antigrafa_... snapshot first (the next backup then reads the whole disk).
# incremental = true

# "qemu" mode: folder on each node for temporary copies of what a VM writes during its
# backup. If this disk fills up, the VM can no longer write: leave free space.
# fleecing_dir = "/var/lib/antigrafa/fleecing"

# Give one guest (by id) its own mode; the others use the source's mode.
# [source.cluster1.guests.650]
# snapshot_mode = "qemu"

# How Antigrafa connects to the nodes with SSH to read the disks.
[source.cluster1.ssh]
user = "root"                                  # SSH user on the nodes
identity_file = "/etc/antigrafa/id_ed25519"    # private key; its public key goes in the nodes' authorized_keys
# ssh -o options. accept-new: a node's host key is recorded on the first connection,
# and a key that changes afterwards is still refused.
# Add "Ciphers=aes128-gcm@openssh.com" for faster encryption, useful above ~500 MiB/s.
options = ["StrictHostKeyChecking=accept-new"]

# SSH address of each node. Without it, the node name is used.
[source.cluster1.nodes.pve1]
host = "10.0.0.11"

[source.cluster1.nodes.pve2]
host = "10.0.0.12"

# =========================================================================== targets
# Where backups go: one [target.<name>] per destination (--target local).

[target.local]
kind = "local"            # a folder on this machine
path = "/srv/antigrafa"

[target.nas]
kind = "nfs"              # an NFS share; nothing is written if it is not mounted
path = "/mnt/nas/antigrafa"
# When data is forced onto the disk:
#   "file": after each piece (safest, slowest); "filesystem": once at the end (default);
#   "none": let the system decide.
sync = "filesystem"

# =========================================================================== web
# Web page: antigrafa web serve (needs pip install 'antigrafa[web]').
# HTTPS only, with a login. Create a user: antigrafa web adduser <name>.
[web]
listen = "0.0.0.0"            # every network card; "127.0.0.1": this machine only
port = 8443
# Users, sessions and the generated certificate.
# Default: /var/lib/antigrafa/web (Linux), %PROGRAMDATA%\antigrafa\web (Windows).
# data_dir = "/var/lib/antigrafa/web"
# Your own certificate (both or none). Without them, one is created on the first start:
# check its fingerprint, printed at startup, against the browser's.
# cert_file = "/etc/antigrafa/web.pem"
# key_file = "/etc/antigrafa/web.key"
# Names used in the browser to reach the page. Default: this machine's names and addresses.
# allowed_hosts = ["backup.example.lan"]

# =========================================================================== scheduled backups
# Backups that run by themselves, started by: antigrafa scheduler.
# antigrafa job list: the jobs and their last result. antigrafa job run <name>: run one now.
# Only one backup or restore runs at a time: the others wait their turn.
#
# Which guests:
#   all = true        every guest, new ones included (exclude = [...] to skip some)
#   guests = [...]    only these
# source and target can be left out when only one of each exists.
#
# When (pick one):
#   schedule = "0 2 * * *"   cron format: minute hour day month weekday (@daily works).
#                            A time missed while the scheduler was stopped is skipped.
#   every = "6h"             every 30m, 6h, 1d... counted from the last start.
#   at = "02:00"             or ["02:00", "14:00"]; add days = ["mon", "fri"] to limit the days.
# Changes are picked up within 15 seconds, no restart needed.
[job.nightly]
source = "cluster1"
target = "nas"
all = true
exclude = [9000]
schedule = "0 2 * * *"

[job.databases]
source = "cluster1"
target = "local"
guests = [101, 102]
every = "6h"
# enabled = false             # keep the job but do not run it

# Folder shared by the scheduler and the web page (lock, job results). Both services
# must be able to write in it.
# Default: /var/lib/antigrafa/scheduler (Linux), %PROGRAMDATA%\antigrafa\scheduler (Windows).
# [scheduler]
# data_dir = "/var/lib/antigrafa/scheduler"

# =========================================================================== log file
# Every command writes its log to a file (more details with -v; -q only quiets the screen).
[log]
# Default: /var/log/antigrafa/antigrafa.log (Linux),
# %PROGRAMDATA%\antigrafa\antigrafa.log (Windows). "none": no log file.
# file = "/var/log/antigrafa/antigrafa.log"
max_size_mib = 1024           # when the file reaches this size, it is archived and a new one starts
max_archives = 5              # number of archives kept; the oldest are deleted
# Archive format: "zip", "tar.gz", "rar" or "7z". rar and 7z need their program
# installed (WinRAR, 7-Zip on Windows); without it, zip is used.
compression = "zip"
# 0 (no compression) to 9 (smallest, slowest); rar: 0 to 5.
# Default: 6 (zip, tar.gz), 3 (rar), 5 (7z).
# compression_level = 6

# =========================================================================== speed
# The defaults suit most cases.
[tuning]
chunk_size_mib = 4            # disks are cut in pieces of this size
max_parallel_guests = 4       # guests backed up at the same time
max_parallel_per_host = 1     # guests backed up at the same time on one node

# Destination: Antigrafa writes more pieces at once while the destination keeps up,
# fewer when a write takes longer than writer_target_latency_ms.
writer_min_concurrency = 1
writer_max_concurrency = 8
writer_start_concurrency = 2
writer_target_latency_ms = 250
# Compression (zstd, 1 = fast to 9 = small). It goes up when the destination is slow.
compression_level = 3         # starting level
compression_min_level = 1
compression_max_level = 9

# Source: reading slows down when the node's disks are busy (iowait), so guests keep their speed.
source_max_mib_s = 0          # maximum read speed in MiB/s; 0 = no limit
source_min_mib_s = 10         # never read slower than this
host_iowait_high = 0.10       # above 10% iowait, read slower
host_iowait_low = 0.03        # below 3% iowait, read faster
low_priority = true           # read with low priority on the node, behind the guests

# A read that stays very slow while Antigrafa waits for it is usually a network fault on
# its connection only (a bad link in a bond or LACP group). It restarts where it stopped,
# on a new connection. Not for containers, Ceph RBD, VMs read through QEMU, incrementals.
stream_min_mib_s = 1          # slower than this (MiB/s) for stream_window_s: new connection; 0 = never
stream_window_s = 60          # seconds
stream_max_reconnects = 5     # new connections per disk at most
