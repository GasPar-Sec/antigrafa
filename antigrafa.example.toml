# Antigrafa configuration: copy to /etc/antigrafa/antigrafa.toml

# --------------------------------------------------------------------------- sources
# One [source.<name>] section per cluster or host to back up. "type" picks the
# platform; the other keys belong to that platform. The name is used on the command
# line (--source) and as the top directory of its backups in each target.

[source.cluster1]
type = "proxmox"
url = "https://pve1.example.lan:8006"
token_id = "antigrafa@pve!backup"
token_secret_file = "/etc/antigrafa/token"   # or token_secret = "..."
# The certificate is verified. Proxmox uses its own CA: copy
# /etc/pve/pve-root-ca.pem from a node and point ca_file at it.
ca_file = "/etc/antigrafa/pve-root-ca.pem"
# Labs only: skip certificate verification (remove ca_file). Anyone on the network
# path can then intercept the API token.
# verify_tls = false
# Chunks are hashed on the node (python3, present on Proxmox VE): only those that
# changed since the previous backup cross the network. Costs CPU on the node, at low
# priority. false: every chunk is sent, hashed here.
# remote_hash = true
# How the disks are captured (no mode stops a guest). "proxmox": snapshot through the
# API; Proxmox snapshots every disk of the guest and refuses if one is on a storage
# without snapshots (LVM thick, iSCSI, raw file), even flagged backup=0. "storage":
# Antigrafa freezes the guest (agent) and snapshots only the disks it backs up,
# directly on their storage. "qemu": running VMs are backed up by QEMU itself, as PBS
# does, on any storage; containers as "storage". "auto": for each guest, the first of
# these that works: "proxmox" (if Proxmox can snapshot every disk and the token has
# VM.Snapshot), else "storage", else "qemu". The choice is logged.
snapshot_mode = "auto"           # default: "proxmox"
# VM disks on ZFS (zvols): the snapshot of a backup stays on the node as the base of
# the next one, which then reads only what ZFS says changed. "auto" takes storage
# snapshots for those guests. While a base exists, Proxmox refuses to roll the disk
# back to an older snapshot: delete the base first (the next backup reads it in full).
# incremental = true
# "qemu" mode: temporary images on the nodes, growing with what a VM writes during
# its backup. If this filesystem fills up, the VM's writes fail: leave room. Created
# 0700 if missing; refused if anyone but root can write to it.
# fleecing_dir = "/var/lib/antigrafa/fleecing"

# One guest with its own snapshot_mode (by id), the source's for the others.
# [source.cluster1.guests.650]
# snapshot_mode = "qemu"

# How Antigrafa reaches the nodes to read the snapshots.
[source.cluster1.ssh]
user = "root"
identity_file = "/etc/antigrafa/id_ed25519"
# Fast cipher, useful above ~500 MiB/s:
# options = ["Ciphers=aes128-gcm@openssh.com"]

# SSH address of each node (otherwise the node name is used as-is).
[source.cluster1.nodes.pve1]
host = "10.0.0.11"

[source.cluster1.nodes.pve2]
host = "10.0.0.12"

# --------------------------------------------------------------------------- targets

[target.local]
kind = "local"
path = "/srv/antigrafa"

[target.nas]
kind = "nfs"              # refuses to write if the share is not mounted
path = "/mnt/nas/antigrafa"
sync = "filesystem"       # "file" (fsync per chunk) | "filesystem" | "none"

# --------------------------------------------------------------------------- web

# Web interface: antigrafa web serve (needs pip install 'antigrafa[web]'). HTTPS only,
# with a login: create users with antigrafa web adduser <name>.
[web]
listen = "0.0.0.0"            # every interface; "127.0.0.1": this machine only
port = 8443
# Users, sessions, secret key, generated certificate.
# Default: /var/lib/antigrafa/web (Linux), %PROGRAMDATA%\antigrafa\web (Windows).
# data_dir = "/var/lib/antigrafa/web"
# Your own certificate (both or neither). Without them, a self-signed certificate is
# created in <data_dir>/tls/ on the first start.
# cert_file = "/etc/antigrafa/web.pem"
# key_file = "/etc/antigrafa/web.key"
# Names the browser may use to reach the page. Default: this machine's names and
# addresses. Add the DNS name when the page is reached through it.
# allowed_hosts = ["backup.example.lan"]

# --------------------------------------------------------------------------- log file

# Every command also writes its log to a file: INFO, DEBUG with -v (-q only quiets the
# terminal). Past max_size_mib, the file is compressed next to it
# (antigrafa-2026-11-20T10-15-00.log.zip) and a new one starts.
[log]
# Default: /var/log/antigrafa/antigrafa.log (Linux),
# %PROGRAMDATA%\antigrafa\antigrafa.log (Windows). "none": no log file.
# file = "/var/log/antigrafa/antigrafa.log"
max_size_mib = 1024           # size of the .log file before it is archived
max_archives = 5              # archives kept, the oldest removed first
# "zip", "tar.gz", "rar" or "7z". rar and 7z need their program: rar (WinRAR on
# Windows), 7z / 7zz / 7za (7-Zip on Windows); without it, the archives are zip.
compression = "zip"
# 0 (no compression) to 9 (smallest, slowest); rar: 0 to 5.
# Default: 6 (zip, tar.gz), 3 (rar), 5 (7z).
# compression_level = 6

# --------------------------------------------------------------------------- tuning

[tuning]
chunk_size_mib = 4
max_parallel_guests = 4       # guests backed up at the same time (all hosts)
max_parallel_per_host = 1     # on a single host

# Destination: target write latency per chunk; above it, concurrency goes down.
writer_min_concurrency = 1
writer_max_concurrency = 8
writer_start_concurrency = 2
writer_target_latency_ms = 250
compression_level = 3
compression_min_level = 1
compression_max_level = 9

# Source: snapshot reads slow down when the host's iowait rises.
source_max_mib_s = 0          # 0 = no fixed cap
source_min_mib_s = 10
host_iowait_high = 0.10
host_iowait_low = 0.03
low_priority = true           # read at low I/O and CPU priority on the host
