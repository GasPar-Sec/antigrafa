[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigrafa"
version = "0.1.0"
description = "VM and container backups with zero guest impact, adapting to destination performance"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
# Python 3.14+ ships zstd in the standard library (compression.zstd).
dependencies = ["zstandard>=0.22; python_version < '3.14'"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
# Everything needed to develop: tests + security analysis (bandit)
dev = ["antigrafa[test]", "bandit>=1.8"]

[project.scripts]
antigrafa = "antigrafa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage on every run: summary in the terminal + coverage.xml for SonarQube
addopts = "--cov --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]
branch = true
# Relative paths in coverage.xml: the report stays valid inside the SonarQube
# container and from one machine to another (Windows, Linux)
relative_files = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "tools"]
