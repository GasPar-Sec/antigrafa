[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigrafa"
version = "0.1.0"
description = "Proxmox VM and container backups with zero guest impact, adapting to destination performance"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
# Python 3.14+ ships zstd in the standard library (compression.zstd).
dependencies = ["zstandard>=0.22; python_version < '3.14'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
antigrafa = "antigrafa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
