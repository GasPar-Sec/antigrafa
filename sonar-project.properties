# SonarQube analysis of antigrafa.
# Run by the "scanner" container: see tools/sonarqube/README.md

sonar.projectKey=antigrafa
sonar.projectName=antigrafa

# Analyzed code and test code
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13,3.14

# Reports produced just before the analysis:
#   pytest -> coverage.xml        (test coverage)
#   bandit -> bandit-report.json  (security issues)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPaths=bandit-report.json

# The analysis fails if the Quality Gate is not met
sonar.qualitygate.wait=true
