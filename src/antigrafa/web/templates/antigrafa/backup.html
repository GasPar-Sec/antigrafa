{% extends "antigrafa/layout.html" %}
{% block title %}Backup · Antigrafa{% endblock %}
{% block content %}
  <section id="start">
    <h2>Start a backup</h2>
    <div class="row">
      <div>
        <label for="source">Source</label>
        <select id="source">{% for name in choices.sources %}<option>{{ name }}</option>{% endfor %}</select>
      </div>
      <div>
        <label for="target">Destination</label>
        <select id="target">{% for name in choices.targets %}<option>{{ name }}</option>{% endfor %}</select>
      </div>
      <div style="flex: 0 0 auto;"><button id="load-guests" type="button">Reload guests</button></div>
    </div>
    <div class="row" style="margin: 14px 0 8px;">
      <label style="display: inline; color: inherit;"><input type="radio" name="mode" value="all" checked> Every guest</label>
      <label style="display: inline; color: inherit;"><input type="radio" name="mode" value="chosen"> Chosen guests</label>
      <span class="muted" id="mode-help"></span>
    </div>
    <p class="muted" id="guests-message">Loading guests…</p>
    <table id="guests" class="hidden">
      <thead><tr><th id="check-header"></th><th>ID</th><th>Type</th><th>Name</th><th>Node</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row" style="margin-top: 14px;">
      <div style="flex: 0 0 auto;"><button id="start-button" class="primary" type="button">Start the backup</button></div>
      <div><p class="error" id="start-error"></p></div>
    </div>
  </section>
{% endblock %}

{% block script %}
<script>
"use strict";

function mode() { return document.querySelector('input[name="mode"]:checked').value; }

function showMode() {
  const all = mode() === "all";
  $("check-header").textContent = all ? "Exclude" : "Back up";
  $("mode-help").textContent = all
    ? "Every guest of the source, including new ones; tick the ones to leave out."
    : "Only the ticked guests.";
  for (const box of document.querySelectorAll("#guests tbody input")) box.checked = false;
}

async function loadGuests() {
  const tbody = $("guests").querySelector("tbody");
  tbody.replaceChildren();
  $("guests").classList.add("hidden");
  $("guests-message").textContent = "Loading guests…";
  $("guests-message").className = "muted";
  try {
    const data = await call(`{% url 'guests' %}?source=${encodeURIComponent($("source").value)}`);
    for (const g of data.guests) {
      const tr = el("tr");
      const box = el("input");
      box.type = "checkbox";
      box.value = g.id;
      const cell = el("td");
      cell.append(box);
      tr.append(cell, el("td", g.id), el("td", g.kind.toUpperCase()), el("td", g.name), el("td", g.host), el("td", g.status));
      tbody.append(tr);
    }
    $("guests-message").textContent = data.guests.length ? "" : "No guest on this source.";
    $("guests").classList.toggle("hidden", !data.guests.length);
  } catch (e) {
    $("guests-message").textContent = e.message;
    $("guests-message").className = "error";
  }
}

async function startBackup() {
  const ticked = [...document.querySelectorAll("#guests tbody input:checked")].map((b) => b.value);
  const all = mode() === "all";
  if (!all && !ticked.length) { $("start-error").textContent = "Tick at least one guest."; return; }
  $("start-error").textContent = "";
  $("start-button").disabled = true;
  try {
    const data = await call("{% url 'start' %}", {
      method: "POST",
      body: JSON.stringify({
        source: $("source").value, target: $("target").value,
        all: all, guests: all ? [] : ticked, exclude: all ? ticked : [],
      }),
    });
    await showStartedRun(data.run);
  } catch (e) {
    $("start-error").textContent = e.message;
  } finally {
    $("start-button").disabled = busy;
  }
}

setStatusHandler(() => { $("start-button").disabled = busy; });
for (const radio of document.querySelectorAll('input[name="mode"]')) radio.addEventListener("change", showMode);
$("source").addEventListener("change", loadGuests);
$("load-guests").addEventListener("click", loadGuests);
$("start-button").addEventListener("click", startBackup);
showMode();
if ($("source").options.length) loadGuests(); else $("guests-message").textContent = "No source configured.";
refresh();
</script>
{% endblock %}
