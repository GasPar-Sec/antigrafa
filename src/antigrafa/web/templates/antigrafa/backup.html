{% extends "antigrafa/layout.html" %}
{% block title %}Backup · Antigrafa{% endblock %}
{% block content %}
  <section id="start">
    <h2>Start a backup</h2>
    <div class="row">
      <div>
        <label for="source">Source</label>
        <select id="source">{% for name in choices.sources %}<option>{{ name }}</option>{% endfor %}</select>
      </div>
      <div>
        <label for="target">Destination</label>
        <select id="target">{% for name in choices.targets %}<option>{{ name }}</option>{% endfor %}</select>
      </div>
      <div style="flex: 0 0 auto;"><button id="load-guests" type="button">Reload guests</button></div>
    </div>
    <div class="row" style="margin: 14px 0 8px;">
      <label style="display: inline; color: inherit;"><input type="radio" name="mode" value="all" checked> Every guest</label>
      <label style="display: inline; color: inherit;"><input type="radio" name="mode" value="chosen"> Chosen guests</label>
      <span class="muted" id="mode-help"></span>
    </div>
    <p class="muted" id="guests-message">Loading guests…</p>
    <table id="guests" class="hidden">
      <thead><tr><th id="check-header"></th><th>ID</th><th>Type</th><th>Name</th><th>Node</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row" style="margin-top: 14px;">
      <div style="flex: 0 0 auto;"><button id="start-button" class="primary" type="button">Start the backup</button></div>
      <div><p class="error" id="start-error"></p></div>
    </div>
  </section>

  <section id="jobs-box">
    <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 style="margin: 0;">Scheduled jobs</h2>
      <button id="load-jobs" type="button">Reload</button>
    </div>
    <p id="scheduler-state" class="muted"></p>
    <p class="muted" id="jobs-message">Loading jobs…</p>
    <table id="jobs" class="hidden">
      <thead><tr><th>Job</th><th>What</th><th>When</th><th>Next run</th><th>Last run</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="error" id="jobs-error"></p>
  </section>
{% endblock %}

{% block script %}
<script>
"use strict";

function mode() { return document.querySelector('input[name="mode"]:checked').value; }

function showMode() {
  const all = mode() === "all";
  $("check-header").textContent = all ? "Exclude" : "Back up";
  $("mode-help").textContent = all
    ? "Every guest of the source, including new ones; tick the ones to leave out."
    : "Only the ticked guests.";
  for (const box of document.querySelectorAll("#guests tbody input")) box.checked = false;
}

async function loadGuests() {
  const tbody = $("guests").querySelector("tbody");
  tbody.replaceChildren();
  $("guests").classList.add("hidden");
  $("guests-message").textContent = "Loading guests…";
  $("guests-message").className = "muted";
  try {
    const data = await call(`{% url 'guests' %}?source=${encodeURIComponent($("source").value)}`);
    for (const g of data.guests) {
      const tr = el("tr");
      const box = el("input");
      box.type = "checkbox";
      box.value = g.id;
      const cell = el("td");
      cell.append(box);
      tr.append(cell, el("td", g.id), el("td", g.kind.toUpperCase()), el("td", g.name), el("td", g.host), el("td", g.status));
      tbody.append(tr);
    }
    $("guests-message").textContent = data.guests.length ? "" : "No guest on this source.";
    $("guests").classList.toggle("hidden", !data.guests.length);
  } catch (e) {
    $("guests-message").textContent = e.message;
    $("guests-message").className = "error";
  }
}

async function startBackup() {
  const ticked = [...document.querySelectorAll("#guests tbody input:checked")].map((b) => b.value);
  const all = mode() === "all";
  if (!all && !ticked.length) { $("start-error").textContent = "Tick at least one guest."; return; }
  $("start-error").textContent = "";
  $("start-button").disabled = true;
  try {
    const data = await call("{% url 'start' %}", {
      method: "POST",
      body: JSON.stringify({
        source: $("source").value, target: $("target").value,
        all: all, guests: all ? [] : ticked, exclude: all ? ticked : [],
      }),
    });
    await showStartedRun(data.run);
  } catch (e) {
    $("start-error").textContent = e.message;
  } finally {
    $("start-button").disabled = busy;
  }
}

// ------------------------------------------------------------------ scheduled jobs

let jobsBusy = null;  // busy when the jobs were last loaded: reloaded when a run ends

function lastRun(last) {
  if (!last) return el("td", "never ran", "muted");
  const cell = el("td");
  cell.append(el("span", last.state, `state-${last.state}`));
  const by = last.by === "web" ? `from the page${last.user ? " by " + last.user : ""}`
    : last.by === "cli" ? "from the command line" : "by the scheduler";
  let text = ` ${time(last.started)} · ${last.guests_ok}/${last.guests_total} OK · ${by}`;
  if (last.error) text += ` · ${last.error}`;
  cell.append(el("span", text));
  return cell;
}

function showScheduler(s) {
  const p = $("scheduler-state");
  if (s.alive) {
    let text = `Scheduler running since ${time(s.started)}.`;
    if (s.running) text += ` Running: ${s.running}.`;
    if (s.queue.length) text += ` Waiting: ${s.queue.join(", ")}.`;
    p.textContent = text;
    p.className = "muted";
  } else {
    p.textContent = "The scheduler is not running: jobs only run at their times while "
      + "`antigrafa scheduler` runs (as a service)." + (s.stopped ? ` It stopped at ${time(s.stopped)}.` : "");
    p.className = "error";
  }
}

async function loadJobs() {
  jobsBusy = busy;
  try {
    const data = await call("{% url 'jobs' %}");
    showScheduler(data.scheduler);
    const tbody = $("jobs").querySelector("tbody");
    tbody.replaceChildren();
    for (const j of data.jobs) {
      const tr = el("tr");
      const name = el("td", j.name);
      if (!j.enabled) name.append(el("span", " (disabled)", "muted"));
      const button = el("button", "Run now");
      button.type = "button";
      button.disabled = busy;
      button.addEventListener("click", () => runJob(j.name, button));
      const action = el("td");
      action.append(button);
      const running = data.scheduler.running === j.name;
      tr.append(name, el("td", j.what), el("td", j.schedule),
        el("td", running ? "running now" : j.next ? time(j.next) : "—"), lastRun(j.last), action);
      tbody.append(tr);
    }
    $("jobs-message").textContent = data.jobs.length ? ""
      : "No job: add [job.<name>] sections to the configuration (see antigrafa.example.toml).";
    $("jobs").classList.toggle("hidden", !data.jobs.length);
    $("jobs-error").textContent = "";
  } catch (e) {
    $("jobs-message").textContent = "";
    $("jobs-error").textContent = e.message;
  }
}

async function runJob(name, button) {
  if (!confirm(`Run job ${name} now?`)) return;
  $("jobs-error").textContent = "";
  button.disabled = true;
  try {
    const data = await call(`/api/jobs/${encodeURIComponent(name)}/run`, {method: "POST"});
    await showStartedRun(data.run);
    $("run").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) {
    $("jobs-error").textContent = e.message;
    button.disabled = busy;
  }
}

setStatusHandler(() => {
  $("start-button").disabled = busy;
  for (const b of document.querySelectorAll("#jobs tbody button")) b.disabled = busy;
  if (jobsBusy !== null && jobsBusy !== busy) loadJobs();  // a run started or ended: last results
});
$("load-jobs").addEventListener("click", loadJobs);
setInterval(loadJobs, 30000);  // the scheduler's heartbeat, its queue, the next runs
loadJobs();
for (const radio of document.querySelectorAll('input[name="mode"]')) radio.addEventListener("change", showMode);
$("source").addEventListener("change", loadGuests);
$("load-guests").addEventListener("click", loadGuests);
$("start-button").addEventListener("click", startBackup);
showMode();
if ($("source").options.length) loadGuests(); else $("guests-message").textContent = "No source configured.";
refresh();
</script>
{% endblock %}
