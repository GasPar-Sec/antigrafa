<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}Antigrafa{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d232b; --muted: #5f6b7a; --line: #dde2e8;
  --accent: #2c6bed; --accent-text: #ffffff; --ok: #1f8a4c; --bad: #c4352b; --warn: #b26a00;
  --bar: #e6eaf0; --code: #f0f2f5; --other: #ff8080;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --panel: #1c2128; --text: #e6e9ed; --muted: #9aa5b1; --line: #2e353e;
    --accent: #5b8cff; --accent-text: #0d1117; --ok: #4cc27f; --bad: #f0675d; --warn: #e3a33b;
    --bar: #2a313a; --code: #161a20; --other: #ff8080;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; }
header .who { color: var(--muted); display: flex; gap: 12px; align-items: center; }
header .brand { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
header nav { display: flex; gap: 4px; }
header nav a { color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 6px; }
header nav a:hover { color: var(--text); background: var(--bg); }
header nav a[aria-current="page"] { color: var(--text); background: var(--bg); font-weight: 600;
  box-shadow: inset 0 -2px 0 var(--accent); }
header nav a.home-tab { display: inline-flex; align-items: center; }
header nav a.home-tab svg { display: block; }
header .account-link { color: var(--muted); text-decoration: none; padding: 5px 8px; border-radius: 6px; }
header .account-link:hover, header .account-link[aria-current="page"] { color: var(--text); background: var(--bg); }
.field { margin-bottom: 12px; }
.field .error { margin: 4px 0 0; font-size: 13px; }
.rules { font-size: 12.5px; margin: 0 0 14px; padding-left: 18px; }
a { color: var(--accent); }
/* minmax(0, 1fr): a long line (error, report) never widens the page */
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: grid;
  grid-template-columns: minmax(0, 1fr); gap: 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
h2 { font-size: 16px; margin: 0 0 12px; }
label { color: var(--muted); font-size: 13px; display: block; margin-bottom: 4px; }
select, input[type=text], input[type=password], input[type=email] { width: 100%; padding: 7px 9px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); font: inherit; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.row > div { flex: 1 1 180px; }
.muted { color: var(--muted); }
.error { color: var(--bad); white-space: pre-wrap; }
.hidden { display: none !important; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top;
  overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
  overflow: auto; font: 12.5px/1.4 ui-monospace, Consolas, monospace; margin: 0;
  white-space: pre-wrap; overflow-wrap: anywhere; }  /* errors read in full, no sideways scrolling */
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  border: 1px solid currentColor; }
.state-running, .state-cancelling { color: var(--accent); }
.state-ok { color: var(--ok); }
.state-failed { color: var(--bad); }
.state-cancelled { color: var(--warn); }
.bar { height: 10px; background: var(--bar); border-radius: 5px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.bar.unknown > span { width: 30% !important; animation: slide 1.4s infinite linear; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.progress-line { display: grid; grid-template-columns: minmax(110px, 180px) 1fr auto; gap: 10px;
  align-items: center; margin: 6px 0; font-size: 13.5px; }
.progress-line .numbers { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.overall { font-size: 14.5px; font-weight: 600; }
.table-box { max-height: 360px; overflow: auto; margin: 6px 0 12px; }
.table-box thead th { position: sticky; top: 0; background: var(--panel); }
.choices { margin-top: 8px; }
.choices label { display: block; color: inherit; font-size: 14.5px; margin: 5px 0; }
.choices label:has(input:disabled) { opacity: .45; }
/* Home page: backups running (each leads to the Backup page), stat tiles, hosts, disks */
.running-run { display: block; color: inherit; text-decoration: none; padding: 8px 10px; margin: 0 -10px;
  border-radius: 6px; }
.running-run:hover, .running-run:focus-visible { background: var(--bg); }
.running-what { font-size: 13.5px; color: var(--muted); }
.machine { margin: -6px 0 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .label { color: var(--muted); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .sub { color: var(--muted); font-size: 12.5px; }
h3 { font-size: 14px; margin: 14px 0 6px; }
.hosts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; font-size: 13.5px; }
.host { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line);
  border-radius: 999px; }
.host .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.host.online .dot { background: var(--ok); }
.host.offline .dot { background: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px;
  vertical-align: -1px; }
/* Fixed columns: the bars of every disk line up */
.disk-line { display: grid; grid-template-columns: minmax(150px, 240px) minmax(120px, 1fr) minmax(0, 430px); gap: 4px 12px;
  align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.disk-line:last-child { border-bottom: 0; }
.disk-line .numbers { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.disk-line .where { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
/* Thin segmented bar: Antigrafa, other data, then the free space (the track) */
.space { display: flex; height: 8px; background: var(--bar); border-radius: 999px; overflow: hidden; }
.space > span { height: 100%; }
.space > span + span { border-left: 2px solid var(--panel); }  /* 2px gap between the parts */
.antigrafa-fill { background: var(--accent); }
.other-fill { background: var(--other); }
.free-fill { background: var(--bar); border: 1px solid var(--line); }
@media (max-width: 640px) {
  .progress-line, .disk-line { grid-template-columns: 1fr; gap: 3px; }
  .disk-line .numbers { text-align: left; }
}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
